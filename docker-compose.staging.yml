# The TEST copy of Bulkport (app "Bulk v2", https://bulk-v2.tulipy.app).
# Lives in its own folder (/opt/bulkport-staging) on the "staging" branch, so
# new versions can be tried before the live stores get them. It has no web
# server of its own: the live Caddy forwards bulk-v2.tulipy.app to it over
# the live copy's network. Set up with scripts/add-staging.sh.
services:
  app-staging:
    build: .
    image: bulkport-staging:latest
    restart: unless-stopped
    # Time for running jobs to finish before a restart or deploy.
    stop_grace_period: 2m
    env_file: .env.production
    environment:
      PORT: "3000"
      NODE_OPTIONS: "--max-old-space-size=1536"
    mem_limit: 2g
    volumes:
      - ./data:/data
    expose:
      - "3000"

networks:
  default:
    name: bulkport_default
    external: true
